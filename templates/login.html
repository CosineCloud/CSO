<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSO · Sign in</title><link rel="stylesheet" href="/static/style.css"></head><body class="login-page"><main class="login-layout"><section class="login-form-section"><div class="login-form-wrap"><a class="brand login-brand" href="/" aria-label="CSO storage console"><span class="brand-mark">c<span>so</span></span><span>Storage console</span></a><h2 id="auth-title">Sign in</h2><p id="auth-description">Use your linked OuthMan account and verification code.</p><div class="auth-tabs"><button id="login-tab" class="active" type="button">Sign in</button><button id="enroll-tab" type="button">Link account</button></div><form id="auth-form"><label>Username or email<input name="username" autocomplete="username" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="Enter your OuthMan password"></label><label>OuthMan verification code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required placeholder="000000"><small>Generate a fresh six-digit code in OuthMan.</small></label><label id="invite-label" hidden>Invitation or bootstrap token<input name="invitation" autocomplete="off" placeholder="Enter your invitation token"></label><div id="auth-error" class="alert error" hidden role="alert"></div><button class="button primary full-width" id="auth-submit">Sign in</button></form><p class="auth-note">Linking an account requires an invitation or administrator bootstrap token.</p></div></section></main><script>window.CSO_CSRF={{ csrf|tojson }};</script><script src="/static/login.js" defer></script></body></html>
